<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <style>
      .app-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 16px; fill: #0f172a; }
      .nav-item { font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; font-size: 13px; fill: #64748b; }
      .nav-active { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #4f46e5; }
      .view-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 18px; fill: #0f172a; }
      .view-sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
      .table-hdr { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 11px; fill: #64748b; }
      .table-cell { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #1e293b; }
      .btn { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="750" fill="#f8fafc" />

  <!-- Navbar -->
  <rect width="1200" height="56" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <rect x="24" y="16" width="24" height="24" rx="6" fill="#4f46e5" />
  <text x="36" y="33" text-anchor="middle" font-family="Inter" font-weight="800" font-size="14" fill="#ffffff">S</text>
  <text x="56" y="33" class="app-title">Synexis</text>

  <!-- Sidebar -->
  <rect y="56" width="220" height="694" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="28" y="92" class="nav-item">📊 Dashboard</text>
  <text x="28" y="130" class="nav-item">📈 Host Telemetry</text>
  <rect x="12" y="145" width="196" height="34" rx="6" fill="#eef2ff" />
  <text x="28" y="167" class="nav-active">🐳 Containers (3)</text>
  <text x="28" y="202" class="nav-item">📜 Log Stream</text>
  <text x="28" y="237" class="nav-item">🚨 Incidents (0)</text>
  <text x="28" y="272" class="nav-item">🧠 AI Root Cause</text>
  <text x="28" y="307" class="nav-item">⚡ Chaos Lab</text>
  <text x="28" y="342" class="nav-item">🔧 Remediation &amp; Audit</text>
  <text x="28" y="377" class="nav-item">🤖 DevOps Copilot</text>
  <text x="28" y="412" class="nav-item">🔌 Data Sources</text>

  <!-- Main Area -->
  <text x="245" y="95" class="view-title">Docker &amp; Container Infrastructure Cluster</text>
  <text x="245" y="115" class="view-sub">Real-time container health telemetry, memory ceilings, port bindings, and lifecycle controls</text>

  <!-- High-Density SRE Table -->
  <rect x="245" y="145" width="930" height="400" rx="8" fill="#ffffff" stroke="#e2e8f0" />
  <rect x="245" y="145" width="930" height="40" rx="8" fill="#f8fafc" />
  <line x1="245" y1="185" x2="1175" y2="185" stroke="#e2e8f0" />

  <text x="265" y="170" class="table-hdr">CONTAINER</text>
  <text x="440" y="170" class="table-hdr">IMAGE</text>
  <text x="610" y="170" class="table-hdr">STATUS</text>
  <text x="720" y="170" class="table-hdr">HEALTH</text>
  <text x="830" y="170" class="table-hdr">CPU</text>
  <text x="910" y="170" class="table-hdr">MEMORY</text>
  <text x="1000" y="170" class="table-hdr">RESTARTS</text>
  <text x="1080" y="170" class="table-hdr">ACTIONS</text>

  <!-- Row 1: demo-app -->
  <circle cx="270" cy="225" r="4" fill="#10b981" />
  <text x="285" y="230" class="table-cell" font-weight="700">synexis-demo-app</text>
  <text x="440" y="230" class="table-cell">sandbox-demo:latest</text>
  <rect x="605" y="212" width="70" height="24" rx="4" fill="#f0fdf4" stroke="#bbf7d0" />
  <text x="640" y="228" text-anchor="middle" class="table-cell" fill="#15803d" font-size="10">RUNNING</text>
  <rect x="715" y="212" width="70" height="24" rx="4" fill="#f0fdf4" stroke="#bbf7d0" />
  <text x="750" y="228" text-anchor="middle" class="table-cell" fill="#15803d" font-size="10">HEALTHY</text>
  <text x="830" y="230" class="table-cell">2.1%</text>
  <text x="910" y="230" class="table-cell">48 / 256 MB</text>
  <text x="1025" y="230" class="table-cell">0</text>
  <rect x="1075" y="215" width="55" height="22" rx="4" fill="#f1f5f9" /><text x="1102" y="230" text-anchor="middle" class="btn">Restart</text>
  <line x1="245" y1="260" x2="1175" y2="260" stroke="#f1f5f9" />

  <!-- Row 2: postgres -->
  <circle cx="270" cy="295" r="4" fill="#10b981" />
  <text x="285" y="300" class="table-cell" font-weight="700">synexis-postgres</text>
  <text x="440" y="300" class="table-cell">postgres:15-alpine</text>
  <rect x="605" y="282" width="70" height="24" rx="4" fill="#f0fdf4" stroke="#bbf7d0" />
  <text x="640" y="298" text-anchor="middle" class="table-cell" fill="#15803d" font-size="10">RUNNING</text>
  <rect x="715" y="282" width="70" height="24" rx="4" fill="#f0fdf4" stroke="#bbf7d0" />
  <text x="750" y="298" text-anchor="middle" class="table-cell" fill="#15803d" font-size="10">HEALTHY</text>
  <text x="830" y="300" class="table-cell">0.8%</text>
  <text x="910" y="300" class="table-cell">94 / 512 MB</text>
  <text x="1025" y="300" class="table-cell">0</text>
  <rect x="1075" y="285" width="55" height="22" rx="4" fill="#f1f5f9" /><text x="1102" y="300" text-anchor="middle" class="btn">Restart</text>
  <line x1="245" y1="330" x2="1175" y2="330" stroke="#f1f5f9" />

  <!-- Row 3: redis -->
  <circle cx="270" cy="365" r="4" fill="#10b981" />
  <text x="285" y="370" class="table-cell" font-weight="700">synexis-redis</text>
  <text x="440" y="370" class="table-cell">redis:7-alpine</text>
  <rect x="605" y="352" width="70" height="24" rx="4" fill="#f0fdf4" stroke="#bbf7d0" />
  <text x="640" y="368" text-anchor="middle" class="table-cell" fill="#15803d" font-size="10">RUNNING</text>
  <rect x="715" y="352" width="70" height="24" rx="4" fill="#f0fdf4" stroke="#bbf7d0" />
  <text x="750" y="368" text-anchor="middle" class="table-cell" fill="#15803d" font-size="10">HEALTHY</text>
  <text x="830" y="370" class="table-cell">0.4%</text>
  <text x="910" y="370" class="table-cell">28 / 128 MB</text>
  <text x="1025" y="370" class="table-cell">0</text>
  <rect x="1075" y="355" width="55" height="22" rx="4" fill="#f1f5f9" /><text x="1102" y="370" text-anchor="middle" class="btn">Restart</text>
</svg>

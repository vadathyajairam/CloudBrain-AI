<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <style>
      .modal-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 16px; fill: #0f172a; }
      .section-hdr { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #475569; text-transform: uppercase; letter-spacing: 0.5px; }
      .chk-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 13px; fill: #1e293b; }
      .chk-detail { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #475569; }
      .chk-badge { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; fill: #15803d; }
    </style>
  </defs>

  <rect width="1200" height="750" fill="#0f172a" fill-opacity="0.6" />

  <!-- Modal Box -->
  <rect x="150" y="40" width="900" height="670" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Modal Header -->
  <rect x="150" y="40" width="900" height="65" rx="12" fill="#f8fafc" />
  <line x1="150" y1="105" x2="1050" y2="105" stroke="#e2e8f0" />
  <rect x="180" y="58" width="85" height="24" rx="4" fill="#f0fdf4" stroke="#bbf7d0" />
  <text x="222" y="74" text-anchor="middle" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#15803d">INC-00042</text>
  <text x="280" y="76" class="modal-title">Post-Remediation 4-Point Health Verification</text>
  <rect x="940" y="58" width="85" height="24" rx="4" fill="#f1f5f9" /><text x="982" y="74" text-anchor="middle" font-family="Inter" font-size="11" font-weight="600" fill="#64748b">Close [ESC]</text>

  <!-- Evidence Tabs -->
  <rect x="180" y="120" width="840" height="35" rx="6" fill="#f1f5f9" />
  <text x="262" y="142" text-anchor="middle" font-family="Inter" font-size="12" font-weight="500" fill="#64748b">1. Evidence Bundle</text>
  <text x="430" y="142" text-anchor="middle" font-family="Inter" font-size="12" font-weight="500" fill="#64748b">2. RAG Runbooks</text>
  <text x="590" y="142" text-anchor="middle" font-family="Inter" font-size="12" font-weight="500" fill="#64748b">3. AI RCA Diagnosis</text>
  <rect x="675" y="122" width="220" height="31" rx="5" fill="#ffffff" />
  <text x="785" y="142" text-anchor="middle" font-family="Inter" font-size="12" font-weight="700" fill="#16a34a">4. 4-Point Health Checks (4/4)</text>

  <!-- Overall Outcome Banner -->
  <rect x="180" y="170" width="840" height="80" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <circle cx="215" cy="210" r="16" fill="#16a34a" />
  <text x="215" y="216" text-anchor="middle" font-family="Inter" font-weight="800" font-size="18" fill="#ffffff">✓</text>

  <text x="245" y="200" font-family="Inter" font-size="15" font-weight="700" fill="#166534">RECOVERY VERIFIED — 4/4 REAL HEALTH PROBES PASSED</text>
  <text x="245" y="222" font-family="Inter" font-size="12" fill="#15803d">Target container <tspan font-family="JetBrains Mono" font-weight="600">synexis-postgres</tspan> restarted successfully. Database daemon, TCP sockets, and client applications fully operational.</text>
  <rect x="910" y="195" width="95" height="28" rx="4" fill="#16a34a" />
  <text x="957" y="213" text-anchor="middle" font-family="Inter" font-size="11" font-weight="700" fill="#ffffff">RESOLVED</text>

  <!-- 4 Probes Grid -->
  <!-- Probe 1 -->
  <rect x="180" y="265" width="405" height="135" rx="8" fill="#ffffff" stroke="#cbd5e1" />
  <rect x="180" y="265" width="405" height="35" rx="8" fill="#f8fafc" />
  <line x1="180" y1="300" x2="585" y2="300" stroke="#e2e8f0" />
  <text x="200" y="288" class="chk-title">1. Docker Process State</text>
  <rect x="495" y="272" width="75" height="20" rx="4" fill="#f0fdf4" stroke="#bbf7d0" /><text x="532" y="286" text-anchor="middle" class="chk-badge">PASSED</text>
  <text x="200" y="325" class="chk-detail">• Target: synexis-postgres</text>
  <text x="200" y="345" class="chk-detail">• Status: RUNNING (PID 48210 active)</text>
  <text x="200" y="365" class="chk-detail">• Exit Code: 0 (Normal execution)</text>

  <!-- Probe 2 -->
  <rect x="615" y="265" width="405" height="135" rx="8" fill="#ffffff" stroke="#cbd5e1" />
  <rect x="615" y="265" width="405" height="35" rx="8" fill="#f8fafc" />
  <line x1="615" y1="300" x2="1020" y2="300" stroke="#e2e8f0" />
  <text x="635" y="288" class="chk-title">2. Native Docker Healthcheck</text>
  <rect x="930" y="272" width="75" height="20" rx="4" fill="#f0fdf4" stroke="#bbf7d0" /><text x="967" y="286" text-anchor="middle" class="chk-badge">PASSED</text>
  <text x="635" y="325" class="chk-detail">• Command: pg_isready -U synexis</text>
  <text x="635" y="345" class="chk-detail">• Response: accepting connections on 5432</text>
  <text x="635" y="365" class="chk-detail">• Container State: HEALTHY</text>

  <!-- Probe 3 -->
  <rect x="180" y="415" width="405" height="135" rx="8" fill="#ffffff" stroke="#cbd5e1" />
  <rect x="180" y="415" width="405" height="35" rx="8" fill="#f8fafc" />
  <line x1="180" y1="450" x2="585" y2="450" stroke="#e2e8f0" />
  <text x="200" y="438" class="chk-title">3. Application HTTP Probe</text>
  <rect x="495" y="422" width="75" height="20" rx="4" fill="#f0fdf4" stroke="#bbf7d0" /><text x="532" y="436" text-anchor="middle" class="chk-badge">PASSED</text>
  <text x="200" y="475" class="chk-detail">• Endpoint: GET http://localhost:5050/health</text>
  <text x="200" y="495" class="chk-detail">• HTTP Status: 200 OK (Database Connected)</text>
  <text x="200" y="515" class="chk-detail">• Probe Latency: 14ms</text>

  <!-- Probe 4 -->
  <rect x="615" y="415" width="405" height="135" rx="8" fill="#ffffff" stroke="#cbd5e1" />
  <rect x="615" y="415" width="405" height="35" rx="8" fill="#f8fafc" />
  <line x1="615" y1="450" x2="1020" y2="450" stroke="#e2e8f0" />
  <text x="635" y="438" class="chk-title">4. Error Log Rate Quiescence</text>
  <rect x="930" y="422" width="75" height="20" rx="4" fill="#f0fdf4" stroke="#bbf7d0" /><text x="967" y="436" text-anchor="middle" class="chk-badge">PASSED</text>
  <text x="635" y="475" class="chk-detail">• Window: Last 30 seconds</text>
  <text x="635" y="495" class="chk-detail">• Connection Errors: 0 detected</text>
  <text x="635" y="515" class="chk-detail">• Error Rate: 0.00 err/sec (Quiescent)</text>

  <!-- Dynamic Learning Footer -->
  <rect x="180" y="565" width="840" height="80" rx="8" fill="#eef2ff" stroke="#c7d2fe" />
  <text x="200" y="590" font-family="Inter" font-size="12" font-weight="700" fill="#3730a3">DYNAMIC RAG INCIDENT LEARNING TRIGGERED</text>
  <text x="200" y="612" font-family="Inter" font-size="11" fill="#4338ca">Incident post-mortem vectorized (128-D) and indexed into <tspan font-family="JetBrains Mono" font-weight="600">rag_chunks</tspan> as <tspan font-family="JetBrains Mono" font-weight="600">IncidentLesson #INC-00042</tspan>.</text>
  <text x="200" y="630" font-family="Inter" font-size="11" fill="#6366f1">Audit record permanently stored in <tspan font-family="JetBrains Mono">audit_logs</tspan> table.</text>
</svg>

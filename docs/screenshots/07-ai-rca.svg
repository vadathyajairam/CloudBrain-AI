<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <style>
      .modal-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 16px; fill: #0f172a; }
      .section-hdr { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
      .rca-text { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #0f172a; line-height: 1.5; }
      .data-desc { font-family: 'Inter', -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .code-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #4338ca; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="750" fill="#0f172a" fill-opacity="0.6" />

  <!-- Modal Box -->
  <rect x="150" y="40" width="900" height="670" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Modal Header -->
  <rect x="150" y="40" width="900" height="65" rx="12" fill="#f8fafc" />
  <line x1="150" y1="105" x2="1050" y2="105" stroke="#e2e8f0" />
  <rect x="180" y="58" width="85" height="24" rx="4" fill="#fff1f2" stroke="#fecdd3" />
  <text x="222" y="74" text-anchor="middle" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#be123c">INC-00042</text>
  <text x="280" y="76" class="modal-title">AI Root Cause Analysis &amp; Remediation Plan</text>
  <rect x="940" y="58" width="85" height="24" rx="4" fill="#f1f5f9" /><text x="982" y="74" text-anchor="middle" font-family="Inter" font-size="11" font-weight="600" fill="#64748b">Close [ESC]</text>

  <!-- Evidence Tabs -->
  <rect x="180" y="120" width="840" height="35" rx="6" fill="#f1f5f9" />
  <text x="262" y="142" text-anchor="middle" font-family="Inter" font-size="12" font-weight="500" fill="#64748b">1. Evidence Bundle</text>
  <text x="430" y="142" text-anchor="middle" font-family="Inter" font-size="12" font-weight="500" fill="#64748b">2. RAG Runbooks</text>
  <rect x="510" y="122" width="160" height="31" rx="5" fill="#ffffff" />
  <text x="590" y="142" text-anchor="middle" font-family="Inter" font-size="12" font-weight="700" fill="#4f46e5">3. AI RCA Diagnosis</text>
  <text x="760" y="142" text-anchor="middle" font-family="Inter" font-size="12" font-weight="500" fill="#64748b">4. Remediation &amp; 4-Point Check</text>

  <!-- Root Cause Hero Banner -->
  <rect x="180" y="170" width="840" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="200" y="195" class="section-hdr">Identified Root Cause</text>
  <rect x="900" y="182" width="105" height="24" rx="4" fill="#eef2ff" stroke="#c7d2fe" />
  <text x="952" y="198" text-anchor="middle" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#3730a3">95% CONFIDENCE</text>

  <text x="200" y="225" class="rca-text">The PostgreSQL database container (<tspan class="code-tag">synexis-postgres</tspan>) terminated unexpectedly (Exit 137),</text>
  <text x="200" y="245" class="rca-text">halting TCP listener on port 5432 and causing cascading connection refusals in <tspan class="code-tag">synexis-demo-app</tspan>.</text>
  <text x="200" y="268" font-family="Inter" font-size="11" fill="#64748b">Diagnostic synthesis grounded in 4 telemetry streams and RUNBOOK-DB-03.</text>

  <!-- Two Column Analysis Grid -->
  <!-- Left Column: Evidence & Alternatives -->
  <rect x="180" y="295" width="405" height="175" rx="8" fill="#ffffff" stroke="#e2e8f0" />
  <text x="200" y="320" class="section-hdr">Correlated Evidence Points</text>
  <text x="200" y="345" class="data-desc">• Docker SDK reported container state: <tspan font-family="JetBrains Mono" font-weight="600" fill="#be123c">exited</tspan></text>
  <text x="200" y="370" class="data-desc">• 14 connection refusal logs emitted within 30s</text>
  <text x="200" y="395" class="data-desc">• HTTP /health returned 503 Service Unavailable</text>

  <text x="200" y="430" class="section-hdr">Alternative Causes Evaluated &amp; Ruled Out</text>
  <text x="200" y="455" font-family="Inter" font-size="11" fill="#64748b">• Network Bridge Partition: Ruled out (demo-app &amp; redis socket OK)</text>

  <!-- Right Column: Recommendation & Structured Action -->
  <rect x="615" y="295" width="405" height="175" rx="8" fill="#f0fdf4" stroke="#bbf7d0" />
  <text x="635" y="320" class="section-hdr" fill="#166534">Proposed Structured Remediation</text>
  <text x="635" y="348" font-family="Inter" font-size="12" font-weight="700" fill="#15803d">Action: <tspan font-family="JetBrains Mono">restart_container</tspan></text>
  <text x="635" y="372" font-family="Inter" font-size="12" font-weight="700" fill="#15803d">Target: <tspan font-family="JetBrains Mono">synexis-postgres</tspan></text>
  <text x="635" y="400" font-family="Inter" font-size="11" fill="#166534">Reason: Restart database daemon to restore TCP port 5432 listener and clear stale client connection locks.</text>
  <text x="635" y="435" font-family="Inter" font-size="11" font-weight="600" fill="#15803d">Risk Level: Low (Stateless container restart / persistent volume)</text>
  <text x="635" y="455" font-family="Inter" font-size="11" fill="#166534">Safety Allowlist: Verified ∈ ALLOWED_ACTIONS &amp; synexis-*</text>

  <!-- RAG Citations Strip -->
  <rect x="180" y="485" width="840" height="95" rx="8" fill="#ffffff" stroke="#e2e8f0" />
  <text x="200" y="510" class="section-hdr">Referenced Knowledge Base Runbooks</text>
  <rect x="200" y="525" width="390" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="215" y="545" font-family="Inter" font-size="11" font-weight="600" fill="#1e293b">RUNBOOK-DB-03: PostgreSQL Connection Failure</text>
  <text x="540" y="545" font-family="JetBrains Mono" font-size="10" font-weight="700" fill="#16a34a">91.2% MATCH</text>

  <rect x="615" y="525" width="390" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="630" y="545" font-family="Inter" font-size="11" font-weight="600" fill="#1e293b">GUIDE-DOCKER-01: Container Lifecycle &amp; Crash</text>
  <text x="955" y="545" font-family="JetBrains Mono" font-size="10" font-weight="600" fill="#64748b">78.6% MATCH</text>

  <!-- Footer Actions -->
  <rect x="180" y="600" width="840" height="45" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="200" y="628" font-family="Inter" font-size="12" fill="#64748b">AI RCA synthesized via Gemini / SRE Rule Fallback in 410ms</text>
  <rect x="820" y="608" width="185" height="30" rx="6" fill="#4f46e5" />
  <text x="912" y="627" text-anchor="middle" font-family="Inter" font-size="11" font-weight="600" fill="#ffffff">Proceed to Approval Gate →</text>
</svg>

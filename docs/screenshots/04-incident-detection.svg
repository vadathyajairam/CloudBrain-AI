<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <style>
      .app-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 16px; fill: #0f172a; }
      .nav-item { font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; font-size: 13px; fill: #64748b; }
      .nav-active { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #4f46e5; }
      .view-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 18px; fill: #0f172a; }
      .view-sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
      .inc-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .table-hdr { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 11px; fill: #64748b; }
      .table-cell { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #1e293b; }
    </style>
  </defs>

  <rect width="1200" height="750" fill="#f8fafc" />

  <!-- Navbar -->
  <rect width="1200" height="56" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <rect x="24" y="16" width="24" height="24" rx="6" fill="#4f46e5" />
  <text x="36" y="33" text-anchor="middle" font-family="Inter" font-weight="800" font-size="14" fill="#ffffff">S</text>
  <text x="56" y="33" class="app-title">Synexis</text>
  <rect x="125" y="18" width="135" height="20" rx="10" fill="#fff1f2" stroke="#fecdd3" />
  <text x="192" y="32" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#be123c">1 ACTIVE INCIDENT</text>

  <!-- Sidebar -->
  <rect y="56" width="220" height="694" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="28" y="92" class="nav-item">📊 Dashboard</text>
  <text x="28" y="130" class="nav-item">📈 Host Telemetry</text>
  <text x="28" y="165" class="nav-item">🐳 Containers (2/3)</text>
  <text x="28" y="200" class="nav-item">📜 Log Stream</text>
  <rect x="12" y="215" width="196" height="34" rx="6" fill="#fff1f2" />
  <text x="28" y="237" font-family="Inter" font-weight="700" font-size="13" fill="#be123c">🚨 Incidents (1)</text>
  <text x="28" y="272" class="nav-item">🧠 AI Root Cause</text>
  <text x="28" y="307" class="nav-item">⚡ Chaos Lab</text>
  <text x="28" y="342" class="nav-item">🔧 Remediation &amp; Audit</text>
  <text x="28" y="377" class="nav-item">🤖 DevOps Copilot</text>
  <text x="28" y="412" class="nav-item">🔌 Data Sources</text>

  <!-- Main Area -->
  <text x="245" y="95" class="view-title">Incident Detection &amp; Lifecycle Management</text>
  <text x="245" y="115" class="view-sub">Real-time anomaly evaluation rules, persistent state transitions, and automated evidence collection</text>

  <!-- Active Incident Card Banner -->
  <rect x="245" y="140" width="930" height="135" rx="10" fill="#ffffff" stroke="#fecdd3" stroke-width="2" />
  <rect x="245" y="140" width="8" height="135" rx="4" fill="#e11d48" />

  <text x="270" y="172" class="table-cell" font-weight="700" fill="#be123c">INC-00042</text>
  <rect x="360" y="158" width="75" height="20" rx="4" fill="#fff1f2" /><text x="397" y="172" text-anchor="middle" class="table-cell" fill="#be123c" font-size="10" font-weight="700">CRITICAL</text>
  <rect x="445" y="158" width="105" height="20" rx="4" fill="#eff6ff" /><text x="497" y="172" text-anchor="middle" class="table-cell" fill="#1d4ed8" font-size="10" font-weight="700">INVESTIGATING</text>
  <text x="960" y="172" class="table-cell" fill="#64748b">Detected: 21:31:42 (12s ago)</text>

  <text x="270" y="205" class="inc-title">Database Stopped — synexis-postgres</text>
  <text x="270" y="228" font-family="Inter" font-size="12" fill="#475569">Target: <tspan font-family="JetBrains Mono" font-weight="600">synexis-postgres</tspan> • Rule: <tspan font-family="JetBrains Mono">container_stopped</tspan> • Cascading Connection Refusal</text>
  <text x="270" y="250" font-family="Inter" font-size="11" fill="#64748b">Evidence: Process exited (exit code 137), 14 connection errors logged in demo-app, health check failing.</text>

  <rect x="1030" y="200" width="125" height="34" rx="6" fill="#4f46e5" />
  <text x="1092" y="222" text-anchor="middle" font-family="Inter" font-size="12" font-weight="600" fill="#ffffff">Investigate →</text>

  <!-- Incident History Table -->
  <rect x="245" y="300" width="930" height="415" rx="8" fill="#ffffff" stroke="#e2e8f0" />
  <rect x="245" y="300" width="930" height="40" rx="8" fill="#f8fafc" />
  <line x1="245" y1="340" x2="1175" y2="340" stroke="#e2e8f0" />

  <text x="265" y="325" class="table-hdr">INCIDENT ID</text>
  <text x="385" y="325" class="table-hdr">TITLE &amp; ROOT CAUSE</text>
  <text x="680" y="325" class="table-hdr">TARGET</text>
  <text x="810" y="325" class="table-hdr">SEVERITY</text>
  <text x="910" y="325" class="table-hdr">STATUS</text>
  <text x="1040" y="325" class="table-hdr">ACTIONS</text>

  <!-- Row 1 (Current Active) -->
  <text x="265" y="375" class="table-cell" font-weight="700">INC-00042</text>
  <text x="385" y="375" class="table-cell" font-weight="600">Database Stopped — synexis-postgres</text>
  <text x="680" y="375" class="table-cell">synexis-postgres</text>
  <text x="810" y="375" class="table-cell" fill="#be123c" font-weight="700">CRITICAL</text>
  <text x="910" y="375" class="table-cell" fill="#1d4ed8" font-weight="700">INVESTIGATING</text>
  <rect x="1040" y="360" width="85" height="24" rx="4" fill="#eef2ff" /><text x="1082" y="376" text-anchor="middle" font-family="Inter" font-size="11" font-weight="600" fill="#4338ca">Inspect</text>
  <line x1="245" y1="405" x2="1175" y2="405" stroke="#f1f5f9" />

  <!-- Row 2 (Previous Resolved) -->
  <text x="265" y="440" class="table-cell" font-weight="700">INC-00041</text>
  <text x="385" y="440" class="table-cell" font-weight="600">CPU Spike — synexis-demo-app</text>
  <text x="680" y="440" class="table-cell">synexis-demo-app</text>
  <text x="810" y="440" class="table-cell" fill="#b45309" font-weight="700">HIGH</text>
  <text x="910" y="440" class="table-cell" fill="#15803d" font-weight="700">RESOLVED</text>
  <rect x="1040" y="425" width="85" height="24" rx="4" fill="#f8fafc" /><text x="1082" y="441" text-anchor="middle" font-family="Inter" font-size="11" font-weight="600" fill="#64748b">Post-Mortem</text>
</svg>

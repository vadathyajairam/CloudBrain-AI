<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 18px; fill: #0f172a; }
      .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; font-size: 12px; fill: #64748b; }
      .box-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #1e293b; }
      .box-desc { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #475569; }
      .net-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #0284c7; font-weight: 600; }
      .obs-label { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; fill: #6366f1; font-weight: 600; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="#ffffff" />
  <rect x="20" y="20" width="860" height="610" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <text x="450" y="55" text-anchor="middle" class="title">Synexis — Isolated Docker Sandbox Environment</text>
  <text x="450" y="75" text-anchor="middle" class="subtitle">Microservice Cluster with Controlled Fault Injection &amp; Verified Remediation</text>

  <!-- Docker Bridge Network Container Box -->
  <rect x="50" y="105" width="800" height="380" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="6" />
  <text x="75" y="135" class="net-label">Docker Isolated Network (synexis-sandbox-net / 172.20.0.0/16)</text>

  <!-- Container 1: Demo App -->
  <rect x="310" y="160" width="280" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <rect x="325" y="175" width="10" height="10" rx="5" fill="#10b981" />
  <text x="345" y="185" class="box-title">synexis-demo-app</text>
  <text x="325" y="210" class="box-desc">Framework: Python 3.11 / Flask</text>
  <text x="325" y="230" class="box-desc">Port: 5050:5000 (HTTP /health)</text>
  <text x="325" y="250" class="box-desc">Role: Microservice API Gateway</text>

  <!-- Container 2: PostgreSQL -->
  <rect x="110" y="340" width="280" height="115" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <rect x="125" y="355" width="10" height="10" rx="5" fill="#10b981" />
  <text x="145" y="365" class="box-title">synexis-postgres</text>
  <text x="125" y="390" class="box-desc">Engine: PostgreSQL 15-alpine</text>
  <text x="125" y="410" class="box-desc">Port: 5433:5432 (TCP pg_isready)</text>
  <text x="125" y="430" class="box-desc">Role: Persistent Transaction DB</text>

  <!-- Container 3: Redis -->
  <rect x="510" y="340" width="280" height="115" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <rect x="525" y="355" width="10" height="10" rx="5" fill="#10b981" />
  <text x="545" y="365" class="box-title">synexis-redis</text>
  <text x="525" y="390" class="box-desc">Engine: Redis 7-alpine</text>
  <text x="525" y="410" class="box-desc">Port: 6380:6379 (redis-cli PING)</text>
  <text x="525" y="430" class="box-desc">Role: In-Memory Key-Value Cache</text>

  <!-- Connection: Demo App -> PostgreSQL -->
  <path d="M 400 270 L 400 305 L 250 305 L 250 340" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="310" y="300" text-anchor="middle" class="box-desc" fill="#0284c7">psycopg2 Connection Pool</text>

  <!-- Connection: Demo App -> Redis -->
  <path d="M 500 270 L 500 305 L 650 305 L 650 340" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="590" y="300" text-anchor="middle" class="box-desc" fill="#0284c7">redis-py Client Socket</text>

  <!-- Synexis Platform Layer Observability -->
  <rect x="150" y="525" width="600" height="75" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" />
  <text x="450" y="552" text-anchor="middle" class="box-title" fill="#3730a3">Synexis Monitoring &amp; Automation Platform</text>
  <text x="450" y="575" text-anchor="middle" class="box-desc" fill="#4338ca">Docker SDK Inspection • psutil Host Telemetry • 4-Point Health Verification</text>

  <!-- Arrows from Platform to Containers -->
  <line x1="250" y1="525" x2="250" y2="455" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)" />
  <line x1="450" y1="525" x2="450" y2="270" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)" />
  <line x1="650" y1="525" x2="650" y2="455" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)" />
</svg>

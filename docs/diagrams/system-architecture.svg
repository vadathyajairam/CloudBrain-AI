<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; font-size: 13px; fill: #64748b; }
      .box-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #1e293b; }
      .box-desc { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #475569; }
      .badge { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 10px; fill: #4338ca; }
      .arrow-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; fill: #64748b; font-weight: 500; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1100" fill="#ffffff" />
  <rect x="20" y="20" width="960" height="1060" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <text x="500" y="60" text-anchor="middle" class="title">Synexis — Intelligent System Analysis &amp; Automation Platform</text>
  <text x="500" y="82" text-anchor="middle" class="subtitle">Complete Technical Architecture &amp; Closed-Loop Remediation Engine</text>

  <!-- 1. Web Console -->
  <rect x="360" y="110" width="280" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="500" y="135" text-anchor="middle" class="box-title">Web Console</text>
  <text x="500" y="153" text-anchor="middle" class="box-desc">Next.js 16 (React, Turbopack, Tailwind)</text>

  <!-- Line to API -->
  <line x1="500" y1="170" x2="500" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="510" y="195" class="arrow-text">HTTP REST API (/api/v1/*)</text>

  <!-- 2. FastAPI Layer -->
  <rect x="340" y="210" width="320" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="500" y="235" text-anchor="middle" class="box-title">FastAPI Backend Gateway</text>
  <text x="500" y="253" text-anchor="middle" class="box-desc">Lifespan Worker • Async Routers • CORS</text>

  <!-- Split lines to Telemetry, Detection, Docker -->
  <path d="M 500 270 L 500 295 L 210 295 L 210 320" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="500" y1="270" x2="500" y2="320" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 500 270 L 500 295 L 790 295 L 790 320" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Core Ingestion Engines -->
  <rect x="90" y="320" width="240" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="210" y="345" text-anchor="middle" class="box-title">Telemetry Pipeline</text>
  <text x="210" y="365" text-anchor="middle" class="box-desc">psutil Host Metrics (3s buffer)</text>

  <rect x="380" y="320" width="240" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="500" y="345" text-anchor="middle" class="box-title">Detection Engine</text>
  <text x="500" y="365" text-anchor="middle" class="box-desc">8 Real Anomaly Evaluation Rules</text>

  <rect x="670" y="320" width="240" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="790" y="345" text-anchor="middle" class="box-title">Container Engine</text>
  <text x="790" y="365" text-anchor="middle" class="box-desc">Docker SDK (synexis-* fleet)</text>

  <!-- Convergence to Incident Manager -->
  <path d="M 210 385 L 210 415 L 480 415 L 480 435" fill="none" stroke="#64748b" stroke-width="1.5" />
  <line x1="500" y1="385" x2="500" y2="435" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 790 385 L 790 415 L 520 415 L 520 435" fill="none" stroke="#64748b" stroke-width="1.5" />

  <!-- 3. Incident Manager -->
  <rect x="340" y="435" width="320" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="500" y="460" text-anchor="middle" class="box-title">Incident Manager</text>
  <text x="500" y="478" text-anchor="middle" class="box-desc">6-State Persistent State Machine</text>

  <!-- Database Box on the right -->
  <rect x="730" y="435" width="180" height="60" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" />
  <text x="820" y="460" text-anchor="middle" class="box-title" fill="#312e81">Application DB</text>
  <text x="820" y="478" text-anchor="middle" class="box-desc">PostgreSQL / SQLite</text>
  <line x1="660" y1="465" x2="730" y2="465" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow-indigo)" />

  <!-- Line to Evidence Bundle -->
  <line x1="500" y1="495" x2="500" y2="530" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 4. Evidence Bundle -->
  <rect x="320" y="530" width="360" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="500" y="552" text-anchor="middle" class="box-title">Multi-Modal Evidence Bundle</text>
  <text x="500" y="570" text-anchor="middle" class="box-desc">Host Metrics • Container State • Logs • DB Traces</text>

  <!-- Branch to RAG and AI RCA -->
  <path d="M 420 585 L 420 610 L 260 610 L 260 635" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 580 585 L 580 610 L 740 610 L 740 635" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- RAG Engine -->
  <rect x="110" y="635" width="300" height="75" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="260" y="660" text-anchor="middle" class="box-title">Vector RAG Engine</text>
  <text x="260" y="678" text-anchor="middle" class="box-desc">128-D Dense Embeddings • Sublinear TF-IDF</text>
  <text x="260" y="696" text-anchor="middle" class="box-desc">BM25 Hybrid Ranking • 11 SRE Runbooks</text>

  <!-- AI RCA Engine -->
  <rect x="590" y="635" width="300" height="75" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="740" y="660" text-anchor="middle" class="box-title">AI RCA Engine</text>
  <text x="740" y="678" text-anchor="middle" class="box-desc">LLM Diagnostic Synthesis (Gemini / OpenAI)</text>
  <text x="740" y="696" text-anchor="middle" class="box-desc">Deterministic Rule Fallback Engine</text>

  <!-- RAG Context link to AI RCA -->
  <line x1="410" y1="672" x2="590" y2="672" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow-indigo)" />
  <text x="500" y="665" text-anchor="middle" class="arrow-text" fill="#4f46e5">RAG Citations</text>

  <!-- Downwards from RCA to Safety & Approval -->
  <path d="M 740 710 L 740 735 L 500 735 L 500 755" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 5. Structured Action & Safety Validation -->
  <rect x="310" y="755" width="380" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="500" y="777" text-anchor="middle" class="box-title">Structured Action &amp; Safety Allowlist</text>
  <text x="500" y="795" text-anchor="middle" class="box-desc">Strict Action Allowlist • synexis-* Boundary Enforcement</text>

  <!-- Line to Human Approval Gate -->
  <line x1="500" y1="810" x2="500" y2="835" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 6. Human Operator Approval Gate -->
  <rect x="330" y="835" width="340" height="50" rx="8" fill="#fef3c7" stroke="#fde047" stroke-width="1.5" />
  <text x="500" y="857" text-anchor="middle" class="box-title" fill="#854d0e">Human-in-the-Loop Operator Gate</text>
  <text x="500" y="873" text-anchor="middle" class="box-desc" fill="#a16207">Role-Based Authorization (admin / sre_operator)</text>

  <!-- Line to Remediation -->
  <line x1="500" y1="885" x2="500" y2="910" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 7. Remediation Engine -->
  <rect x="350" y="910" width="300" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="500" y="932" text-anchor="middle" class="box-title">Remediation Engine</text>
  <text x="500" y="948" text-anchor="middle" class="box-desc">Docker SDK Lifecycle Execution</text>

  <!-- Line to 4-Point Health Verification -->
  <line x1="500" y1="960" x2="500" y2="985" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 8. Real 4-Point Verification -->
  <rect x="290" y="985" width="420" height="55" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="500" y="1007" text-anchor="middle" class="box-title" fill="#166534">Real 4-Point Health Verification</text>
  <text x="500" y="1025" text-anchor="middle" class="box-desc" fill="#15803d">1. Process State  2. Docker Health  3. App Probe  4. Log Quiescence</text>

  <!-- Loop back to RAG for Incident Learning -->
  <path d="M 290 1012 L 80 1012 L 80 672 L 110 672" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)" />
  <text x="70" y="850" text-anchor="middle" class="arrow-text" fill="#16a34a" transform="rotate(-90 70 850)">Dynamic Incident Learning (RESOLVED)</text>
</svg>

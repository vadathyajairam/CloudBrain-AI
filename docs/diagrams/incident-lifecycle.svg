<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 18px; fill: #0f172a; }
      .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; font-size: 12px; fill: #64748b; }
      .state-title { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; }
      .state-desc { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .db-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #6366f1; font-weight: 600; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#ffffff" />
  <rect x="20" y="20" width="860" height="660" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <text x="450" y="55" text-anchor="middle" class="title">Synexis — 6-State Persistent Incident Lifecycle</text>
  <text x="450" y="75" text-anchor="middle" class="subtitle">Deterministic State Transitions Synchronized with PostgreSQL / SQLite Database</text>

  <!-- State 1: DETECTED -->
  <rect x="80" y="120" width="220" height="80" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" />
  <text x="190" y="148" text-anchor="middle" class="state-title" fill="#be123c">1. DETECTED</text>
  <text x="190" y="170" text-anchor="middle" class="state-desc">Anomaly rule triggers;</text>
  <text x="190" y="186" text-anchor="middle" class="state-desc">dedup key active</text>

  <!-- Line 1 -> 2 -->
  <line x1="300" y1="160" x2="360" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- State 2: ACKNOWLEDGED -->
  <rect x="360" y="120" width="220" height="80" rx="8" fill="#fffbeb" stroke="#fef3c7" stroke-width="1.5" />
  <text x="470" y="148" text-anchor="middle" class="state-title" fill="#b45309">2. ACKNOWLEDGED</text>
  <text x="470" y="170" text-anchor="middle" class="state-desc">Operator acknowledges</text>
  <text x="470" y="186" text-anchor="middle" class="state-desc">or auto-triaged</text>

  <!-- Line 2 -> 3 -->
  <line x1="580" y1="160" x2="640" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- State 3: INVESTIGATING -->
  <rect x="640" y="120" width="220" height="80" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
  <text x="750" y="148" text-anchor="middle" class="state-title" fill="#1d4ed8">3. INVESTIGATING</text>
  <text x="750" y="170" text-anchor="middle" class="state-desc">Evidence collected;</text>
  <text x="750" y="186" text-anchor="middle" class="state-desc">RAG &amp; AI RCA analysis</text>

  <!-- Line 3 -> 4 (Down and left) -->
  <path d="M 750 200 L 750 260 L 750 280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- State 4: REMEDIATING -->
  <rect x="640" y="280" width="220" height="80" rx="8" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="1.5" />
  <text x="750" y="308" text-anchor="middle" class="state-title" fill="#a21caf">4. REMEDIATING</text>
  <text x="750" y="330" text-anchor="middle" class="state-desc">Operator approved fix;</text>
  <text x="750" y="346" text-anchor="middle" class="state-desc">Docker SDK executing</text>

  <!-- Line 4 -> 5 -->
  <line x1="640" y1="320" x2="580" y2="320" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- State 5: RESOLVED -->
  <rect x="360" y="280" width="220" height="80" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="470" y="308" text-anchor="middle" class="state-title" fill="#15803d">5. RESOLVED</text>
  <text x="470" y="330" text-anchor="middle" class="state-desc">4-Point check passed;</text>
  <text x="470" y="346" text-anchor="middle" class="state-desc">RAG lesson indexed</text>

  <!-- Line 5 -> 6 -->
  <line x1="360" y1="320" x2="300" y2="320" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- State 6: CLOSED -->
  <rect x="80" y="280" width="220" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="190" y="308" text-anchor="middle" class="state-title" fill="#334155">6. CLOSED</text>
  <text x="190" y="330" text-anchor="middle" class="state-desc">Post-mortem archived;</text>
  <text x="190" y="346" text-anchor="middle" class="state-desc">dedup key released</text>

  <!-- Database Persistence Bar -->
  <rect x="80" y="420" width="780" height="180" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />
  <text x="105" y="445" class="db-label">DATABASE PERSISTENCE &amp; AUDIT TRAIL (SQLAlchemy ORM)</text>
  
  <text x="105" y="475" class="state-desc">• Table <tspan font-family="JetBrains Mono" font-weight="600">incidents</tspan>: Stores ID, title, severity, status, timestamps, affected service, resolution notes.</text>
  <text x="105" y="505" class="state-desc">• Table <tspan font-family="JetBrains Mono" font-weight="600">incident_evidence</tspan>: Stores metrics snapshots, container exit codes, logs, and database traces.</text>
  <text x="105" y="535" class="state-desc">• Table <tspan font-family="JetBrains Mono" font-weight="600">audit_logs</tspan>: Records every state change, operator approval, remediation dispatch, and health verification check.</text>
  <text x="105" y="565" class="state-desc">• Table <tspan font-family="JetBrains Mono" font-weight="600">rag_chunks</tspan>: Automatically stores vectorized incident lessons for future similarity matching.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 18px; fill: #0f172a; }
      .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; font-size: 12px; fill: #64748b; }
      .step-num { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px; fill: #4f46e5; }
      .step-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #1e293b; }
      .step-desc { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #64748b; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="1350" fill="#ffffff" />
  <rect x="20" y="20" width="860" height="1310" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <text x="450" y="55" text-anchor="middle" class="title">Synexis — Complete 14-Stage Operational Workflow</text>
  <text x="450" y="75" text-anchor="middle" class="subtitle">End-to-End Autonomous Incident Detection, Vector RAG Diagnostics, &amp; Verified Recovery</text>

  <!-- Flow Items (14 boxes vertically arranged) -->
  <!-- 1. Infrastructure Event -->
  <rect x="250" y="100" width="400" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="270" y="125" class="step-num">STAGE 01</text>
  <text x="350" y="125" class="step-title">Infrastructure Event</text>
  <text x="270" y="143" class="step-desc">Container stop, CPU/RAM spike, or error burst occurs in cluster</text>
  <line x1="450" y1="155" x2="450" y2="180" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 2. Telemetry Collection -->
  <rect x="250" y="180" width="400" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="270" y="205" class="step-num">STAGE 02</text>
  <text x="350" y="205" class="step-title">Telemetry Collection</text>
  <text x="270" y="223" class="step-desc">psutil host probes + Docker SDK stats stream continuously (3s)</text>
  <line x1="450" y1="235" x2="450" y2="260" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 3. Anomaly Detection -->
  <rect x="250" y="260" width="400" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="270" y="285" class="step-num">STAGE 03</text>
  <text x="350" y="285" class="step-title">Anomaly Detection</text>
  <text x="270" y="303" class="step-desc">8 continuous evaluation rules check sustained thresholds &amp; states</text>
  <line x1="450" y1="315" x2="450" y2="340" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 4. Incident Creation -->
  <rect x="250" y="340" width="400" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="270" y="365" class="step-num">STAGE 04</text>
  <text x="350" y="365" class="step-title">Incident Creation</text>
  <text x="270" y="383" class="step-desc">Deduplication key check; persisted in DB with state DETECTED</text>
  <line x1="450" y1="395" x2="450" y2="420" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 5. Evidence Collection -->
  <rect x="250" y="420" width="400" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="270" y="445" class="step-num">STAGE 05</text>
  <text x="350" y="445" class="step-title">Evidence Collection</text>
  <text x="270" y="463" class="step-desc">Aggregates host metrics, container state, logs, &amp; DB probes</text>
  <line x1="450" y1="475" x2="450" y2="500" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 6. RAG Retrieval -->
  <rect x="250" y="500" width="400" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="270" y="525" class="step-num">STAGE 06</text>
  <text x="350" y="525" class="step-title">Vector RAG Retrieval</text>
  <text x="270" y="543" class="step-desc">128-D dense cosine sim + BM25 hybrid ranking of runbooks</text>
  <line x1="450" y1="555" x2="450" y2="580" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 7. AI Root Cause Analysis -->
  <rect x="250" y="580" width="400" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="270" y="605" class="step-num">STAGE 07</text>
  <text x="350" y="605" class="step-title">AI Root Cause Analysis (RCA)</text>
  <text x="270" y="623" class="step-desc">LLM diagnostic synthesis (Gemini/OpenAI) + offline rule fallback</text>
  <line x1="450" y1="635" x2="450" y2="660" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 8. Recommendation -->
  <rect x="250" y="660" width="400" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="270" y="685" class="step-num">STAGE 08</text>
  <text x="350" y="685" class="step-title">Structured Action Recommendation</text>
  <text x="270" y="703" class="step-desc">Outputs structured action (action, target, reason, confidence)</text>
  <line x1="450" y1="715" x2="450" y2="740" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 9. Safety Validation -->
  <rect x="250" y="740" width="400" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="270" y="765" class="step-num">STAGE 09</text>
  <text x="350" y="765" class="step-title">Safety &amp; Allowlist Validation</text>
  <text x="270" y="783" class="step-desc">Validates action ∈ ALLOWED_ACTIONS and target ∈ synexis-*</text>
  <line x1="450" y1="795" x2="450" y2="820" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 10. Operator Approval -->
  <rect x="250" y="820" width="400" height="55" rx="8" fill="#fef3c7" stroke="#fde047" stroke-width="1.5" />
  <text x="270" y="845" class="step-num" fill="#854d0e">STAGE 10</text>
  <text x="350" y="845" class="step-title" fill="#854d0e">Human Operator Approval Gate</text>
  <text x="270" y="863" class="step-desc" fill="#a16207">Role check (admin/sre_operator); reject blocks all execution</text>
  <line x1="450" y1="875" x2="450" y2="900" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 11. Remediation -->
  <rect x="250" y="900" width="400" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="270" y="925" class="step-num">STAGE 11</text>
  <text x="350" y="925" class="step-title">Remediation Execution</text>
  <text x="270" y="943" class="step-desc">Executes authorized Docker SDK command (restart/start/stop)</text>
  <line x1="450" y1="955" x2="450" y2="980" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 12. Recovery Verification -->
  <rect x="250" y="980" width="400" height="55" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="270" y="1005" class="step-num" fill="#166534">STAGE 12</text>
  <text x="350" y="1005" class="step-title" fill="#166534">Real 4-Point Health Verification</text>
  <text x="270" y="1023" class="step-desc" fill="#15803d">Verifies Process state, Docker health, App probe, &amp; Log quiescence</text>
  <line x1="450" y1="1035" x2="450" y2="1060" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 13. Incident Resolution -->
  <rect x="250" y="1060" width="400" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="270" y="1085" class="step-num">STAGE 13</text>
  <text x="350" y="1085" class="step-title">Incident Resolution</text>
  <text x="270" y="1103" class="step-desc">Incident status transitions to RESOLVED; recorded in audit_logs</text>
  <line x1="450" y1="1115" x2="450" y2="1140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 14. Knowledge Indexing -->
  <rect x="250" y="1140" width="400" height="55" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" />
  <text x="270" y="1165" class="step-num" fill="#3730a3">STAGE 14</text>
  <text x="350" y="1165" class="step-title" fill="#3730a3">Dynamic Knowledge Indexing</text>
  <text x="270" y="1183" class="step-desc" fill="#4338ca">Resolved post-mortem vectorized into RAG store as IncidentLesson</text>
</svg>

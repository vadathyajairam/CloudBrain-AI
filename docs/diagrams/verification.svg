<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 18px; fill: #0f172a; }
      .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; font-size: 12px; fill: #64748b; }
      .box-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #1e293b; }
      .box-desc { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #475569; }
      .chk-num { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px; fill: #15803d; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="800" fill="#ffffff" />
  <rect x="20" y="20" width="860" height="760" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <text x="450" y="55" text-anchor="middle" class="title">Synexis — Real 4-Point Health Verification Pipeline</text>
  <text x="450" y="75" text-anchor="middle" class="subtitle">Multi-Layered Post-Remediation Verification Before Incident Resolution</text>

  <!-- Step 0: Remediation Executed -->
  <rect x="300" y="110" width="300" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="450" y="132" text-anchor="middle" class="box-title">Remediation Executed</text>
  <text x="450" y="148" text-anchor="middle" class="box-desc">Docker SDK restart/start completed</text>
  <line x1="450" y1="160" x2="450" y2="195" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 4-Check Grid Container -->
  <rect x="60" y="195" width="780" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="450" y="225" text-anchor="middle" class="box-title">Multi-Layered Health Probe Suite (verification_engine.py)</text>

  <!-- Check 1: Process State -->
  <rect x="80" y="245" width="350" height="105" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="100" y="270" class="chk-num">CHECK 01: Docker Process State</text>
  <text x="100" y="295" class="box-desc">• Inspects container.status via Docker SDK</text>
  <text x="100" y="315" class="box-desc">• Target status must equal "running"</text>
  <text x="100" y="335" class="box-desc">• Process PID must be actively allocated</text>

  <!-- Check 2: Native Docker Health -->
  <rect x="470" y="245" width="350" height="105" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="490" y="270" class="chk-num">CHECK 02: Native Docker Healthcheck</text>
  <text x="490" y="295" class="box-desc">• Evaluates container HEALTHCHECK probe</text>
  <text x="490" y="315" class="box-desc">• e.g. pg_isready -U synexis exit code 0</text>
  <text x="490" y="335" class="box-desc">• Container state must equal "healthy"</text>

  <!-- Check 3: Application HTTP Probe -->
  <rect x="80" y="365" width="350" height="105" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="100" y="390" class="chk-num">CHECK 03: Application HTTP /health Probe</text>
  <text x="100" y="415" class="box-desc">• Dispatches HTTP GET to microservice endpoint</text>
  <text x="100" y="435" class="box-desc">• e.g. http://localhost:5050/health</text>
  <text x="100" y="455" class="box-desc">• Status must return HTTP 200 OK</text>

  <!-- Check 4: Error Log Quiescence -->
  <rect x="470" y="365" width="350" height="105" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="490" y="390" class="chk-num">CHECK 04: Error Log Rate Quiescence</text>
  <text x="490" y="415" class="box-desc">• Scans log stream over 30-second window</text>
  <text x="490" y="435" class="box-desc">• Counts ERROR / CRITICAL log frequency</text>
  <text x="490" y="455" class="box-desc">• Error rate must drop below threshold (&lt; 2)</text>

  <!-- Evaluation Diamond -->
  <line x1="450" y1="485" x2="450" y2="530" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <polygon points="450,530 570,580 450,630 330,580" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
  <text x="450" y="575" text-anchor="middle" class="box-title">All 4 Checks</text>
  <text x="450" y="593" text-anchor="middle" class="box-title">Passed?</text>

  <!-- Outcomes -->
  <!-- YES branch (Right) -->
  <path d="M 570 580 L 680 580 L 680 660" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <text x="620" y="570" text-anchor="middle" class="chk-num">YES</text>

  <rect x="560" y="660" width="240" height="80" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="680" y="688" text-anchor="middle" class="box-title" fill="#166534">Incident RESOLVED</text>
  <text x="680" y="710" text-anchor="middle" class="box-desc" fill="#15803d">• Status updated in DB</text>
  <text x="680" y="728" text-anchor="middle" class="box-desc" fill="#15803d">• Post-mortem indexed in RAG</text>

  <!-- NO branch (Left) -->
  <path d="M 330 580 L 220 580 L 220 660" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <text x="280" y="570" text-anchor="middle" class="chk-num" fill="#e11d48">NO</text>

  <rect x="100" y="660" width="240" height="80" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" />
  <text x="220" y="688" text-anchor="middle" class="box-title" fill="#be123c">Remain in INVESTIGATING</text>
  <text x="220" y="710" text-anchor="middle" class="box-desc" fill="#9f1239">• Alert escalated to SRE team</text>
  <text x="220" y="728" text-anchor="middle" class="box-desc" fill="#9f1239">• Failure reason recorded</text>
</svg>

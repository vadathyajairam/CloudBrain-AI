<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 850" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 18px; fill: #0f172a; }
      .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; font-size: 12px; fill: #64748b; }
      .layer-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 13px; fill: #1e293b; }
      .pill-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #334155; }
      .pill-desc { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #64748b; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="950" height="850" fill="#ffffff" />
  <rect x="20" y="20" width="910" height="810" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <text x="475" y="55" text-anchor="middle" class="title">Synexis — Platform Technology Stack</text>
  <text x="475" y="75" text-anchor="middle" class="subtitle">Complete Technical Architecture &amp; Component Stack</text>

  <!-- Layer 1: Frontend Layer -->
  <rect x="50" y="105" width="850" height="95" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="75" y="130" class="layer-title">1. Presentation &amp; Operator Interface Layer</text>

  <rect x="75" y="145" width="180" height="42" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="165" y="162" text-anchor="middle" class="pill-title">Next.js 16 (Turbopack)</text>
  <text x="165" y="177" text-anchor="middle" class="pill-desc">App Router • React 19</text>

  <rect x="275" y="145" width="180" height="42" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="365" y="162" text-anchor="middle" class="pill-title">TypeScript 5</text>
  <text x="365" y="177" text-anchor="middle" class="pill-desc">Static Type Safety</text>

  <rect x="475" y="145" width="180" height="42" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="565" y="162" text-anchor="middle" class="pill-title">Tailwind / CSS Tokens</text>
  <text x="565" y="177" text-anchor="middle" class="pill-desc">SRE Dark/Light Modes</text>

  <rect x="675" y="145" width="205" height="42" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="777" y="162" text-anchor="middle" class="pill-title">Native SVG Live Charts</text>
  <text x="777" y="177" text-anchor="middle" class="pill-desc">Real Telemetry Visualizer</text>

  <!-- Layer 2: API & Backend Layer -->
  <rect x="50" y="215" width="850" height="95" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="75" y="240" class="layer-title">2. API Gateway &amp; Application Layer</text>

  <rect x="75" y="255" width="180" height="42" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="165" y="272" text-anchor="middle" class="pill-title">Python 3.11+</text>
  <text x="165" y="287" text-anchor="middle" class="pill-desc">Core Execution Runtime</text>

  <rect x="275" y="255" width="180" height="42" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="365" y="272" text-anchor="middle" class="pill-title">FastAPI v2.5.0</text>
  <text x="365" y="287" text-anchor="middle" class="pill-desc">Async REST API / OpenAPI</text>

  <rect x="475" y="255" width="180" height="42" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="565" y="272" text-anchor="middle" class="pill-title">Lifespan Worker</text>
  <text x="565" y="287" text-anchor="middle" class="pill-desc">Background 3s Pipeline</text>

  <rect x="675" y="255" width="205" height="42" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="777" y="272" text-anchor="middle" class="pill-title">Pydantic v2</text>
  <text x="777" y="287" text-anchor="middle" class="pill-desc">Strict Schema Validation</text>


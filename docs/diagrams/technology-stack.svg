  <rect x="50" y="325" width="850" height="95" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" />
  <text x="75" y="350" class="layer-title" fill="#3730a3">3. Intelligence, RAG, &amp; Diagnostics Engine</text>

  <rect x="75" y="365" width="180" height="42" rx="6" fill="#ffffff" stroke="#c7d2fe" />
  <text x="165" y="382" text-anchor="middle" class="pill-title" fill="#3730a3">128-D Dense Embeddings</text>
  <text x="165" y="397" text-anchor="middle" class="pill-desc">Sublinear TF-IDF + Subwords</text>

  <rect x="275" y="365" width="180" height="42" rx="6" fill="#ffffff" stroke="#c7d2fe" />
  <text x="365" y="382" text-anchor="middle" class="pill-title" fill="#3730a3">Hybrid Retrieval</text>
  <text x="365" y="397" text-anchor="middle" class="pill-desc">0.60 Cosine + 0.40 BM25</text>

  <rect x="475" y="365" width="180" height="42" rx="6" fill="#ffffff" stroke="#c7d2fe" />
  <text x="565" y="382" text-anchor="middle" class="pill-title" fill="#3730a3">Grounded AI RCA</text>
  <text x="565" y="397" text-anchor="middle" class="pill-desc">Gemini / OpenAI Models</text>

  <rect x="675" y="365" width="205" height="42" rx="6" fill="#ffffff" stroke="#c7d2fe" />
  <text x="777" y="382" text-anchor="middle" class="pill-title" fill="#3730a3">Rule-Based Fallback</text>
  <text x="777" y="397" text-anchor="middle" class="pill-desc">Deterministic SRE Engine</text>

  <!-- Layer 4: Observability & Ingestion -->
  <rect x="50" y="435" width="850" height="95" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="75" y="460" class="layer-title">4. Observability &amp; Ingestion Subsystem</text>

  <rect x="75" y="475" width="260" height="42" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="205" y="492" text-anchor="middle" class="pill-title">psutil (Local Machine)</text>
  <text x="205" y="507" text-anchor="middle" class="pill-desc">Real CPU, Memory, Disk, Network I/O</text>

  <rect x="355" y="475" width="260" height="42" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="485" y="492" text-anchor="middle" class="pill-title">Docker Python SDK</text>
  <text x="485" y="507" text-anchor="middle" class="pill-desc">Container Metrics, Logs, &amp; Lifecycle</text>

  <rect x="635" y="475" width="245" height="42" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="757" y="492" text-anchor="middle" class="pill-title">8 Continuous Detection Rules</text>
  <text x="757" y="507" text-anchor="middle" class="pill-desc">Sub-second Threshold Evaluators</text>

  <!-- Layer 5: Storage & Persistence Layer -->
  <rect x="50" y="545" width="850" height="95" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="75" y="570" class="layer-title">5. Persistence &amp; Database Layer</text>

  <rect x="75" y="585" width="260" height="42" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="205" y="602" text-anchor="middle" class="pill-title">SQLAlchemy 2.0 ORM</text>
  <text x="205" y="617" text-anchor="middle" class="pill-desc">Declarative Mappings &amp; Session Pool</text>

  <rect x="355" y="585" width="260" height="42" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="485" y="602" text-anchor="middle" class="pill-title">PostgreSQL 15 (Production)</text>
  <text x="485" y="617" text-anchor="middle" class="pill-desc">ACID Relational Storage Engine</text>

  <rect x="635" y="585" width="245" height="42" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="757" y="602" text-anchor="middle" class="pill-title">SQLite 3 (Development)</text>
  <text x="757" y="617" text-anchor="middle" class="pill-desc">Zero-Setup Local Dev Fallback</text>

  <!-- Layer 6: Sandbox & Infrastructure -->
  <rect x="50" y="655" width="850" height="95" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="75" y="680" class="layer-title" fill="#166534">6. Controlled Sandbox &amp; Verification Environment</text>

  <rect x="75" y="695" width="200" height="42" rx="6" fill="#ffffff" stroke="#86efac" />
  <text x="175" y="712" text-anchor="middle" class="pill-title" fill="#166534">synexis-demo-app</text>
  <text x="175" y="727" text-anchor="middle" class="pill-desc" fill="#15803d">Flask Web App (Port 5050)</text>

  <rect x="295" y="695" width="200" height="42" rx="6" fill="#ffffff" stroke="#86efac" />
  <text x="395" y="712" text-anchor="middle" class="pill-title" fill="#166534">synexis-postgres</text>
  <text x="395" y="727" text-anchor="middle" class="pill-desc" fill="#15803d">PostgreSQL 15 (Port 5433)</text>

  <rect x="515" y="695" width="180" height="42" rx="6" fill="#ffffff" stroke="#86efac" />
  <text x="605" y="712" text-anchor="middle" class="pill-title" fill="#166534">synexis-redis</text>
  <text x="605" y="727" text-anchor="middle" class="pill-desc" fill="#15803d">Redis 7 (Port 6380)</text>

  <rect x="715" y="695" width="165" height="42" rx="6" fill="#ffffff" stroke="#86efac" />
  <text x="797" y="712" text-anchor="middle" class="pill-title" fill="#166534">Pytest Suite</text>
  <text x="797" y="727" text-anchor="middle" class="pill-desc" fill="#15803d">62 Passing Tests</text>
</svg>
